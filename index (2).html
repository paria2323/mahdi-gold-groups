<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>گروه‌های طلای مهدی</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #171717, #292929);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #d4af37, #f7df86);
      color: #171717;
      font-size: 38px;
      box-shadow: 0 8px 30px rgba(212,175,55,.25);
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle {
      margin: 0 0 25px;
      color: #d6d6d6;
      font-size: 14px;
      line-height: 1.8;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #fff;
      padding: 16px;
      margin: 12px 0;
      border-radius: 17px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      transition: transform .2s, background .2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.15);
    }
    .icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .wa { background: #25D366; }
    .eitaa { background: #159bd7; }
    .rubika { background: #8e44ad; }
    .text { text-align: right; flex: 1; }
    .text strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .text span { color: #cfcfcf; font-size: 12px; }
    .arrow { font-size: 20px; color: #d4af37; }
    footer {
      margin-top: 22px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Au</div>
    <h1>طلای مهدی</h1>
    <p class="subtitle">برای ورود به گروه موردنظر، یکی از گزینه‌های زیر را انتخاب کنید.</p>

    <a class="btn" href="https://chat.whatsapp.com/CMHc1gAXA681SvLr8CCmhJ" target="_blank" rel="noopener">
      <div class="icon wa">◉</div>
      <div class="text">
        <strong>گروه واتساپ طلای مهدی</strong>
        <span>ورود به گروه واتساپ</span>
      </div>
      <div class="arrow">‹</div>
    </a>

    <a class="btn" href="https://eitaa.com/mahdi_gold_gallery1" target="_blank" rel="noopener">
      <div class="icon eitaa">✈</div>
      <div class="text">
        <strong>گروه ایتا طلای مهدی</strong>
        <span>ورود به گروه ایتا</span>
      </div>
      <div class="arrow">‹</div>
    </a>

    <a class="btn" href="https://rubika.ir/mahdi_gold_gallery1" target="_blank" rel="noopener">
      <div class="icon rubika">R</div>
      <div class="text">
        <strong>گروه روبیکا طلای مهدی</strong>
        <span>ورود به گروه روبیکا</span>
      </div>
      <div class="arrow">‹</div>
    </a>

    <footer>طلای مهدی • شبکه‌های اجتماعی</footer>
  </main>
</body>
</html>
